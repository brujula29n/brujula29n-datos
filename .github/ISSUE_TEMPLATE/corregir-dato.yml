name: Corregir un dato
description: Un dato de la web es incorrecto o está desactualizado
labels: [correccion]
body:
  - type: input
    id: donde
    attributes:
      label: ¿Dónde aparece?
      description: Sección de la web o fichero de data/ (por ejemplo, Partidos → PP, o data/encuestas.json)
    validations:
      required: true
  - type: textarea
    id: dato
    attributes:
      label: ¿Qué dice y qué debería decir?
    validations:
      required: true
  - type: input
    id: fuente
    attributes:
      label: Fuente que lo corrige (URL)
      description: Mejor si es oficial (BOE, INE, sentencia, organismo independiente)
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Esta incidencia es pública. No incluyas datos personales de nadie (tampoco los tuyos) ni acusaciones sin fuente: se ocultarán. Si te afecta personalmente o prefieres no hacerlo en público, escribe a hola@brujula29n.com."
